[package]
name = "tg-lite"
version = "0.0.4"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
crossterm = "0.29.0"
getrandom = "0.4.3"
grammers-client = { version = "0.11.0", features = ["markdown", "proxy"] }
grammers-mtsender = "0.11.0"
grammers-session = { version = "0.11.0", default-features = false, features = ["serde"] }
jiff = "0.2.38"
rand = "0.10.3"
ratatui = "0.30.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
zeroize = "1.9.1"

[profile.release]
opt-level = "s"     # компактный и быстрый код
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
